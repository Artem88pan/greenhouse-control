[project]
name = "state-mock"
version = "0.1.0"
description = "State (Оценка) emulator"
authors = [{ name = "Artem Panov", email = "vonap88@mail.ru" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.118.0,<0.119.0",
  "uvicorn>=0.37.0,<0.38.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
